name: Build macOS (Self-Hosted)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly sync build every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    name: macOS ARM64 (M1 Max)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Sync with upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git remote add upstream https://github.com/LadybirdBrowser/ladybird.git 2>/dev/null || true
          git fetch upstream master
          git merge upstream/master --no-edit
          git push origin master

      - name: Wait for network
        run: |
          for i in $(seq 1 30); do
            curl -sf --max-time 5 https://github.com > /dev/null && break
            echo "Waiting for network... ($i/30)"
            sleep 5
          done

      - name: Install dependencies
        run: |
          brew install autoconf autoconf-archive automake ccache cmake nasm ninja pkg-config 2>/dev/null || true

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: |
            ccache-macos-arm64-

      - name: Build Ladybird
        run: |
          export PATH="/opt/homebrew/opt/ccache/libexec:$PATH"
          caffeinate -dims ./Meta/ladybird.py build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 8
          VCPKG_MAX_CONCURRENCY: 4
          MAKEFLAGS: -j4

      - name: Install (cmake --install with proper rpaths)
        run: |
          cmake --install Build/release --prefix install-staging

      - name: Bundle vcpkg dependencies
        run: |
          APP_LIB="install-staging/bundle/Ladybird.app/Contents/lib"
          VCPKG_LIB="Build/release/vcpkg_installed/arm64-osx-dynamic/lib"

          # Copy all versioned vcpkg dylibs (skip symlinks, copy real files only)
          find "$VCPKG_LIB" -maxdepth 1 -name '*.dylib' ! -type l -exec cp {} "$APP_LIB/" \;

          # Fix rpaths: change vcpkg absolute paths to @loader_path in all bundled libs
          for lib in "$APP_LIB"/*.dylib; do
            # Update install name to @rpath-relative
            install_name_tool -id "@rpath/$(basename "$lib")" "$lib" 2>/dev/null || true
            # Replace any reference to vcpkg lib dir with @loader_path
            otool -L "$lib" | grep "$VCPKG_LIB" | awk '{print $1}' | while read -r dep; do
              install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$lib" 2>/dev/null || true
            done
          done

          echo "✅ Bundled $(find "$APP_LIB" -name '*.dylib' ! -type l | wc -l | tr -d ' ') dylibs"

      - name: Sign app bundle
        run: |
          codesign --force --deep --sign - install-staging/bundle/Ladybird.app

      - name: Deploy to /Applications
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          rm -rf /Applications/Ladybird.app
          cp -R install-staging/bundle/Ladybird.app /Applications/Ladybird.app
          echo "✅ Installed Ladybird.app to /Applications"

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: Ladybird-macOS-arm64
          path: install-staging/bundle/Ladybird.app
          retention-days: 14

      - name: Print ccache stats
        run: ccache --show-stats
